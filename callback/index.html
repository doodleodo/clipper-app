<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clipper – Connect</title><link rel="stylesheet" href="../style.css"></head><body><h1>Clipper</h1><p id="msg">Reading answer from TikTok…</p><p><input id="code" readonly style="width:100%;font-size:1em;padding:8px"></p><p><button id="copy">Copy</button></p><p>Paste this code into Clipper (Dashboard). It is valid for a few minutes only.</p><script>const q=new URLSearchParams(location.search);const code=q.get("code"), state=q.get("state"), err=q.get("error");const msg=document.getElementById("msg"), box=document.getElementById("code");if(err){msg.textContent="TikTok error: "+err;}else if(code){msg.textContent="Connected. Your code:";box.value=code+(state?"|"+state:"");}else{msg.textContent="No code found.";}document.getElementById("copy").onclick=()=>{box.select();navigator.clipboard.writeText(box.value);};</script></body></html>
